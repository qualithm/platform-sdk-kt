# The release version: tag-on-release reads this line, dx tool version-bump
# rewrites it, and Gradle sets the project's version from it. 0.0.0 is the
# unreleased sentinel, so nothing is tagged.
version=0.1.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
