# Generated by dx/scripts/ci-sync from ci-templates/kotlin-lib.yaml.
# Do not edit directly — change the template and re-run ci-sync.

name: CI

on:
  pull_request:
    branches: [main, test, development]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # The one JDK every Kotlin template runs; dx config check holds them together.
  # Gradle is pinned by the repo's wrapper, Kotlin and the plugins by its
  # version catalog. The library is one Gradle project at the repo root.
  JAVA_VERSION: "21.0.12"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.f.outputs.code == 'true' || steps.f.outputs.ci == 'true' }}
      is-main: ${{ steps.tier.outputs.is-main }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          # A file must match every pattern. Under the default, any one match
          # is enough, so '**' alone marks every file as code and no exclusion
          # applies.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.github/**'
              - '!.githooks/**'
              - '!.vscode/**'
              - '!scripts/**'
              - '!LICENSE'
            # The one file under .github/ that changes what these jobs run.
            ci:
              - '.github/workflows/ci.yaml'
      - id: tier
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Validates the wrapper jar against Gradle's published checksums, and
      # restores the Gradle caches. PRs restore but never save: a PR-scoped
      # cache dies with the PR and only evicts the main-scoped one.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      - name: Check formatting (ktfmt)
        run: ./gradlew ktfmtCheck
      - name: Static analysis (detekt)
        run: ./gradlew detekt

  test:
    name: Test & Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Validates the wrapper jar against Gradle's published checksums, and
      # restores the Gradle caches. PRs restore but never save: a PR-scoped
      # cache dies with the PR and only evicts the main-scoped one.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # The gate covers the library's own sources. A repo excludes what falls
      # outside it (examples, generated code) in its Kover config, never here.
      - name: Test with coverage
        run: ./gradlew test koverXmlReport
      - name: Enforce coverage threshold (>=80%)
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          report = ET.parse("build/reports/kover/report.xml").getroot()
          line = next((c for c in report.findall("counter") if c.get("type") == "LINE"), None)
          if line is None:
              sys.exit("No LINE counter in build/reports/kover/report.xml")
          covered, missed = int(line.get("covered")), int(line.get("missed"))
          if covered + missed == 0:
              sys.exit("No lines measured")
          pct = covered / (covered + missed) * 100
          print(f"Line coverage: {pct:.2f}% ({covered}/{covered + missed})")
          if pct < 80:
              sys.exit("Coverage below 80% threshold")
          EOF
      - name: Fetch Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # A pinned GitHub release instead of the action's runtime download
          # from cli.codecov.io, whose TLS handshake fails from our runners.
          # Bump both values together.
          CODECOV_CLI_VERSION: v11.3.1
          CODECOV_CLI_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/codecov" \
            "https://github.com/codecov/codecov-cli/releases/download/$CODECOV_CLI_VERSION/codecovcli_linux"
          echo "$CODECOV_CLI_SHA256  $RUNNER_TEMP/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload
        id: codecov-retry
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          fail_ci_if_error: true
      # Non-blocking by design: Codecov reports coverage, it never gates it, so
      # a Codecov outage must not fail CI Required. A missed upload surfaces
      # as a warning annotation and a job summary line instead.
      - name: Report a failed Codecov upload
        if:
          ${{ !cancelled() && steps.codecov.outcome != 'success' && steps.codecov-retry.outcome !=
          'success' }}
        run: |
          echo "::warning title=Codecov upload failed::coverage was not uploaded to Codecov after a retry"
          echo "Codecov upload failed after a retry. See the upload steps in this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/reports/kover/report.xml
          retention-days: 14

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Validates the wrapper jar against Gradle's published checksums, and
      # restores the Gradle caches. PRs restore but never save: a PR-scoped
      # cache dies with the PR and only evicts the main-scoped one.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # The library jar and its sources jar; a repo with examples hooks their
      # compilation onto assemble, so they build here too.
      - name: Build the library
        run: ./gradlew assemble

  docs:
    name: Docs
    needs: changes
    # Full tier: the API docs build only on the main hop, where a release is
    # cut from. The repo's Dokka config fails on a warning, so an undocumented
    # public declaration fails this job.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.is-main == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Validates the wrapper jar against Gradle's published checksums, and
      # restores the Gradle caches. PRs restore but never save: a PR-scoped
      # cache dies with the PR and only evicts the main-scoped one.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      - name: Build the API docs (Dokka)
        run: ./gradlew dokkaGenerate

  # dx:generated-drift-begin
  generated-drift:
    name: Generated Drift
    # A generated client commits its generator's output. Rerunning the pinned
    # generator on the committed spec must reproduce it exactly, so a hand edit
    # can't pass as a generator change.
    # Ungated by `changes`: the generator pin and config live outside the code
    # filter. A repo without openapi-generator.yaml generates nothing and skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Regenerate and fail on any difference
        run: |
          if [ ! -f openapi-generator.yaml ]; then
            echo "no openapi-generator.yaml: not a generated client; skipping"
            exit 0
          fi
          scripts/generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code differs from what scripts/generate writes. Run scripts/generate and commit the result; never edit generated files by hand."
            git status --short
            git diff --stat
            exit 1
          fi
  # dx:generated-drift-end
  image-pins:
    name: Image Pins
    # Every image reference in the repo must match the vendored dx registry.
    # Runs on every PR, docs included: a README can carry an image reference
    # too. A repo with no vendored registry references no container image and
    # skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check image pins against the vendored dx registry
        run: |
          if [ ! -f .github/images/images.config ]; then
            echo "no vendored registry: repo references no container image; skipping"
            exit 0
          fi
          .github/images/images check --config .github/images/images.config .

  ci-required:
    name: CI Required
    if: always()
    needs: [changes, lint, test, build, docs, generated-drift, image-pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dependent jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' \
            || { echo "::error::One or more required jobs failed or were cancelled"; exit 1; }
